services:

  postgres:

    image: postgres:16

    container_name: paymentshield_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: paymentshield
      POSTGRES_USER: paymentshield_user
      POSTGRES_PASSWORD: paymentshield_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: